<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FamilyFrame TV — Google OAuth</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px;
      line-height: 1.5;
    }
    h1 { font-size: 1.4em; margin-bottom: 0; }
    .sub { color: #888; font-size: 0.85em; margin-top: 4px; }
    .target {
      background: #1e1e1e10;
      border: 1px solid #8884;
      border-radius: 8px;
      padding: 12px;
      margin: 16px 0;
      font-family: monospace;
      font-size: 0.9em;
      word-break: break-all;
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 1.1em;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
      margin: 8px 0;
    }
    button:active { background: #1d4ed8; }
    button:disabled { background: #888; cursor: not-allowed; }
    .log {
      margin-top: 16px;
      padding: 12px;
      background: #1e1e1e08;
      border: 1px solid #8884;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.85em;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 80px;
    }
    .ok { color: #16a34a; }
    .err { color: #dc2626; }
    .warn { color: #d97706; }
  </style>
</head>
<body>
  <h1>FamilyFrame TV — Google OAuth</h1>
  <p class="sub">
    Шаг 1 — войти в Google и разрешить доступ к Google Фото.
    Шаг 2 — передать код телевизору.
    Если браузер спросит про доступ к устройствам в локальной сети — нажмите «Разрешить».
  </p>

  <div id="target" class="target" hidden>Цель: <span id="target-url"></span></div>

  <div id="buttons"></div>

  <div id="log" class="log">Готов.</div>

  <script>
    'use strict';

    const REDIRECT_URI = 'https://butyringit.github.io/familyframe-bridge/oauth.html';
    const SCOPE = 'https://www.googleapis.com/auth/photospicker.mediaitems.readonly';

    const p = new URLSearchParams(location.search);
    const logEl = document.getElementById('log');
    const buttonsEl = document.getElementById('buttons');

    function log(msg, cls) {
      const line = document.createElement('div');
      if (cls) line.className = cls;
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logEl.appendChild(line);
    }

    function addButton(text, handler) {
      const b = document.createElement('button');
      b.textContent = text;
      b.addEventListener('click', handler);
      buttonsEl.appendChild(b);
      return b;
    }

    function showTarget(text) {
      document.getElementById('target-url').textContent = text;
      document.getElementById('target').hidden = false;
    }

    function b64urlEncode(str) {
      return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function b64urlDecode(s) {
      let b = s.replace(/-/g, '+').replace(/_/g, '/');
      while (b.length % 4) b += '=';
      return atob(b);
    }

    const HINTS = 'Возможные причины: (1) браузер заблокировал доступ к локальной сети — посмотрите, не появился ли запрос разрешения; (2) ТВ не в той же Wi-Fi; (3) приложение на ТВ не на экране пробы.';

    if (p.has('error')) {
      // A) Google вернул ошибку
      let m = `Google вернул ошибку: ${p.get('error')}`;
      if (p.get('error_description')) m += ` (${p.get('error_description')})`;
      log(m, 'err');
    } else if (p.has('code')) {
      // B) Возврат от Google
      const code = p.get('code');
      const scope = p.get('scope') || '';
      let ip, port;
      try {
        const st = JSON.parse(b64urlDecode(p.get('state') || ''));
        ip = st.ip;
        port = st.port || '8765';
        if (!ip) throw new Error('no ip');
      } catch (e) {
        log('Неверный state — откройте страницу заново через QR', 'err');
      }
      if (ip) {
        // убрать код из адресной строки
        history.replaceState(null, '', location.pathname);
        const url = `http://${ip}:${port}/oauth`;
        showTarget(url);
        log(`Код от Google получен (${code.length} символов)`, 'ok');
        log(`scope: ${scope}`);

        const btnPost = addButton('Передать на ТВ (POST)', async () => {
          btnPost.disabled = true;
          log('→ POST отправляю…');
          const t0 = performance.now();
          try {
            const resp = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ code, scope })
            });
            const dt = Math.round(performance.now() - t0);
            const body = await resp.text().catch(() => '(empty)');
            log(`HTTP ${resp.status} за ${dt} мс. Ответ ТВ:\n${body}`, resp.ok ? 'ok' : 'err');
          } catch (e) {
            const dt = Math.round(performance.now() - t0);
            log(`❌ Ошибка за ${dt} мс: ${e.name}: ${e.message}`, 'err');
            log(HINTS, 'warn');
          } finally {
            btnPost.disabled = false;
          }
        });
        addButton('Передать на ТВ (переход)', () => {
          location.href = `http://${ip}:${port}/oauth?code=${encodeURIComponent(code)}&scope=${encodeURIComponent(scope)}`;
        });
      }
    } else {
      // C) Открыто с QR на ТВ
      const ip = p.get('ip');
      const port = p.get('port') || '8765';
      const cid = p.get('cid');
      const cc = p.get('cc');
      if (!ip || !cid || !cc) {
        log('Откройте страницу через QR на телевизоре', 'err');
      } else {
        showTarget(`http://${ip}:${port}/oauth`);
        addButton('Войти в Google', () => {
          const q = new URLSearchParams({
            client_id: cid,
            redirect_uri: REDIRECT_URI,
            response_type: 'code',
            scope: SCOPE,
            access_type: 'offline',
            prompt: 'consent',
            code_challenge: cc,
            code_challenge_method: 'S256',
            state: b64urlEncode(JSON.stringify({ ip, port }))
          });
          location.href = `https://accounts.google.com/o/oauth2/v2/auth?${q.toString()}`;
        });
      }
    }
  </script>
</body>
</html>
